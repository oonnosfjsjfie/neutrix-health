<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <script src="pwa.js?v=20261125a" defer></script>
    <script src="native-app.js?v=20261125c"></script>
    <script src="app-shell.js?v=20261128c"></script>
    <script src="assistant.js?v=20261128a" defer></script>
    <link rel="apple-touch-icon" href="assets/neutrix-icon.png">
    <!-- Accounts + online saving (must load before issue-scope.js) -->
    <script src="firebase-config.js?v=20261030c"></script>
    <script src="neutrix-cloud.js?v=20261127c"></script>
    <!-- Login check, per-issue data and the issue bar -->
    <script>
        // The Emergency Card covers ALL medical issues, so it opens from My Issues too (no open issue needed).
        if (localStorage.getItem('neutrix_authenticated') !== 'true') location.replace('signin.html?next=emergency-card.html');
        else {
            let ok = false;
            try { const id = localStorage.getItem('neutrixActiveIssue'); ok = JSON.parse(localStorage.getItem('neutrixIssues') || '[]').some(i => i.id === id); } catch (e) {}
            if (ok) document.write('<script src="issue-scope.js?v=20261127c"><\/script>');
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutrix | Emergency Card</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="skin.css?v=20261128d">
</head>
<body data-page="emergencycard">

    <nav class="ehr-navbar">
        <div class="nav-container">
            <div class="hospital-brand">
                <div class="cross-icon">+</div>
                <div class="brand-text">
                    <span class="brand-title">NEUTRIX HEALTH</span>
                    <span class="brand-sub" data-i18n="brandSub">Post-Discharge Patient Portal</span>
                </div>
            </div>
            <div class="system-controls">
                <button class="ctrl-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
                <button class="ctrl-btn" id="langToggle" type="button">🌐 മലയാളം</button>
            </div>
        </div>
    </nav>

    <main class="ehr-workspace ec-page">
        <section class="ehr-card">
            <div id="ecStale" class="ec-stale" hidden></div>
            <div class="ec-grid">
                <div class="ec-phone-wrap">
                    <div class="ec-cap" id="ecPrevTitle"></div>
                    <div class="ec-phone"><iframe id="ecPreview" title="Emergency card preview" loading="lazy"></iframe></div>
                </div>
                <div class="ec-info">
                    <h3 class="ec-h" id="ecCheckTitle"></h3>
                    <ul class="ec-check" id="ecCheck"></ul>
                    <h3 class="ec-h" id="ecAlertTitle"></h3>
                    <div id="ecAlerts"></div>
                    <p class="hint" id="ecPrivacy"></p>
                </div>
            </div>
        </section>

        <aside class="ehr-card chart-card ec-side">
            <div class="chart-header"><h3 id="ecQrTitle"></h3><span class="mrn-badge">🆘</span></div>
            <div id="ecQr" class="dc-qr ec-qr"></div>
            <div class="ec-actions">
                <button type="button" class="btn-primary" id="ecWall"></button>
                <button type="button" class="btn-secondary" id="ecWallet"></button>
                <button type="button" class="btn-secondary" id="ecShare"></button>
                <a class="btn-secondary" id="ecOpen" target="_blank" rel="noopener"></a>
            </div>
            <details class="ec-how"><summary id="ecHowT"></summary><div id="ecHow"></div></details>
            <footer class="ehr-disclaimer"><p id="ecNote"></p></footer>
        </aside>
    </main>
    <div id="ecWalletPrint" class="ec-wallet-print" aria-hidden="true"></div>

    <script src="common.js?v=20261128c"></script>
    <script src="account-menu.js?v=20261030e"></script>
    <script src="history.js?v=20261126a"></script>
    <script src="nx-care.js?v=20261127c"></script>
    <script src="feedback.js?v=20261030c"></script>
    <script src="vendor/qrcode.js?v=1.5.4"></script>
    <script src="doctor-card.js?v=20261128b"></script>
    <script src="emergency-card.js?v=20261128b"></script>
    <script src="chat.js?v=20261030c"></script>
</body>
</html>
