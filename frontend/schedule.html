            <div id="schedView" class="hidden">

    <script src="family.js?v=20261127c"></script>
    <script>
        // Make the daily schedule automatically.
        // - First visit: build it from the reports
        // - Reports changed since: rebuild it; if the medicines changed, a new version
        //   starts today, so earlier days keep the medicines that were taken then
        const schedRecord = loadReport();

        function startSchedulePage() {
            document.getElementById('schedLoading').classList.add('hidden');            const script = document.createElement('script');
            script.src = 'schedule.js?v=20261127c';
            document.body.appendChild(script);
        }

        function showLoading(key) {
            document.getElementById('schedLoading').classList.remove('hidden');
            document.getElementById('schedRetryBtn').classList.add('hidden');
            document.getElementById('schedLoadingText').textContent = t(key);
        }

        // First visit: make the schedule. Reports changed: a new dated version is added (history.js),
        // so earlier days keep the medicines that were taken then and the medicine history stays complete.
        function syncAndStart() {
            const saved = storeGet('neutrixSchedule');
            const exists = saved && saved.reportId === schedRecord.createdAt && scheduleVersions(saved).some(v => v.doses.length);
            const upToDate = exists && (saved.version || reportVersion(schedRecord, true)) === reportVersion(schedRecord);
            if (upToDate) { startSchedulePage(); return; }
            showLoading(exists ? 'schedUpdating' : 'scheduleLoading');
            NxHist.syncSchedule(schedRecord).then(startSchedulePage).catch(err => {
                if (exists) { startSchedulePage(); return; }       // couldn't update now: keep the current schedule, try again next time
                document.getElementById('schedLoadingText').textContent = err.message;
                document.getElementById('schedRetryBtn').classList.remove('hidden');
            });
        }

        document.getElementById('schedRetryBtn').addEventListener('click', syncAndStart);

        if (!schedRecord) {
            document.getElementById('schedEmpty').classList.remove('hidden');
        } else {
            syncAndStart();
        }
    </script>
    <script src="visuals.js?v=20261030e"></script>
    <script src="nx-charts.js?v=20261029b"></script>
    <script src="chat.js?v=20261030c"></script>
