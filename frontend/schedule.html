            <div id="schedView" class="hidden">

                <div class="day-nav">

                <!-- Intake report PDF -->

            </footer>
        </aside>

    <script src="common.js?v=20261029c"></script>
    <script src="account-menu.js?v=20261029c"></script>
    <script>
        // Make the daily schedule automatically.
        // - First visit: build it from the reports
        // - Reports changed since: rebuild it; if the medicines changed, a new version
        //   starts today, so earlier days keep the medicines that were taken then
        const schedRecord = loadReport();

        function startSchedulePage() {
            document.getElementById('schedLoading').classList.add('hidden');
            const script = document.createElement('script');
            script.src = 'schedule.js';
            document.body.appendChild(script);
        }

        function doseKey(d) {
            return `${d.medicine}|${d.strength}|${d.dose}|${d.slot}|${d.duration}`.toLowerCase();
        }

        async function fetchDoses() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 120000);
            try {
                const res = await fetch(`${API_BASE}/api/schedule`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        report_text: fullReportText(schedRecord),
                        bill_text: schedRecord.billText || '',
                        language: neutrixLang
                    }),
                    signal: controller.signal
                });
                if (!res.ok) throw new Error(`Server error ${res.status}`);
                const data = await res.json();
                if (data.ok === false) throw new Error(data.message);
                return data.doses;
            } catch (err) {
                throw err.name === 'AbortError' ? new Error(t('askTimeout')) : err;
            } finally {
                clearTimeout(timer);
            }
        }

        function showLoading(key) {
            document.getElementById('schedLoading').classList.remove('hidden');
            document.getElementById('schedRetryBtn').classList.add('hidden');
            document.getElementById('schedLoadingText').textContent = t(key);
        }

        // First visit: a new schedule
        async function buildSchedule() {
            showLoading('scheduleLoading');
            try {
                const doses = await fetchDoses();
                const today = dayKey(new Date());
                storeSet('neutrixSchedule', {
                    reportId: schedRecord.createdAt,
                    version: reportVersion(schedRecord),
                    createdAt: new Date().toISOString(),
                    startDate: today,
                    versions: [{ from: today, doses: doses.map((d, i) => ({ ...d, id: 'v0d' + i })) }],
                    ticks: {}
                });
                startSchedulePage();
            } catch (err) {
                document.getElementById('schedLoadingText').textContent = err.message;
                document.getElementById('schedRetryBtn').classList.remove('hidden');
            }
        }

        // Reports changed: update the medicines from today onwards
        async function updateSchedule(saved) {
            showLoading('schedUpdating');
            try {
                const doses = await fetchDoses();
                const versions = scheduleVersions(saved);
                const today = dayKey(new Date());
                const current = dosesForDay(saved, today);

                const same = doses.length === current.length &&
                    doses.map(doseKey).sort().join() === current.map(doseKey).sort().join();

                if (!same) {
                    const n = versions.length;
                    const newDoses = doses.map((d, i) => ({ ...d, id: `v${n}d${i}` }));

                    // Keep today's ticks for medicines that are still in the plan
                    const todayTicks = (saved.ticks || {})[today] || {};
                    const carried = {};
                    newDoses.forEach(nd => {
                        const old = current.find(od => od.medicine === nd.medicine && od.slot === nd.slot && todayTicks[od.id]);
                        if (old) carried[nd.id] = todayTicks[old.id];
                    });
                    if (!saved.ticks) saved.ticks = {};
                    saved.ticks[today] = carried;

                    // A version that started today is replaced; otherwise a new one starts today
                    const last = versions[versions.length - 1];
                    if (last.from === today && versions.length > 1) versions[versions.length - 1] = { from: today, doses: newDoses };
                    else if (last.from === today) last.doses = newDoses;
                    else versions.push({ from: today, doses: newDoses });
                }
                saved.version = reportVersion(schedRecord);
                storeSet('neutrixSchedule', saved);
            } catch (err) {
                // Couldn't update now: keep the current schedule and try again next time
            }
            startSchedulePage();
        }

        document.getElementById('schedRetryBtn').addEventListener('click', buildSchedule);

        if (!schedRecord) {
            document.getElementById('schedEmpty').classList.remove('hidden');
        } else {
            const saved = storeGet('neutrixSchedule');
            const sameIssueReports = saved && saved.reportId === schedRecord.createdAt &&
                scheduleVersions(saved).some(v => v.doses.length);

            if (!sameIssueReports) {
                buildSchedule();
            } else if ((saved.version || reportVersion(schedRecord, true)) !== reportVersion(schedRecord)) {
                updateSchedule(saved);
            } else {
                startSchedulePage();
            }
        }
    </script>
    <script src="chat.js"></script>
</body>
</html>
