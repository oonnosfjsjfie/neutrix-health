<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/neutrix-icon.png">
    <!-- Accounts + online saving (must load before issue-scope.js) -->
    <script src="firebase-config.js?v=20261029d"></script>
    <script src="neutrix-cloud.js?v=20261029d"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutrix | My Medical Issues</title>
    <script>
        // Only logged-in users can see this page
        if (localStorage.getItem('neutrix_authenticated') !== 'true') {
            window.location.replace('signin.html?next=issues.html');
        } else if (!localStorage.getItem('neutrix_hospital_profile')) {
            // First visit after signing up: fill in the patient profile once
            window.location.replace('profile.html?back=issues.html');
        }
    </script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="skin.css">
    <style>
        /* ---------- Page layout: issues full width, "How it works" strip underneath ---------- */
        .nx-site main.ehr-workspace.issues-page { grid-template-columns: 1fr; max-width: 1200px; }

        .issues-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
        .issues-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .issues-title-row h2 { margin: 0; }
        .issues-count {
            font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px;
            border: 1px solid var(--border-color); color: var(--text-secondary);
        }
        .issues-hint { font-size: 13px; color: var(--text-muted); margin: 6px 0 0; }
        .add-issue-btn { white-space: nowrap; padding: 13px 24px; }

        .issue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

        /* Issue card */
        .issue-card {
            position: relative;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background: var(--bg-workspace);
            padding: 22px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .issue-card::before {
            content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
            background: linear-gradient(90deg, #ff007a, #a855f7, #3b82f6, #00f2fe);
            opacity: 0.35; transition: opacity 0.25s ease;
        }
        .issue-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22); }
        .issue-card:hover::before, .issue-card.active::before { opacity: 1; }
        .issue-card.active { border-color: rgba(168, 85, 247, 0.45); box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.25), 0 14px 34px rgba(168, 85, 247, 0.12); }

        .issue-top { display: flex; gap: 14px; align-items: center; }
        .issue-icon {
            width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            border: 2px solid transparent;
            background:
                linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                linear-gradient(135deg, #ff007a, #a855f7, #3b82f6, #00f2fe) border-box;
        }
        .issue-title { font-size: 18px; font-weight: 700; color: var(--text-primary); line-height: 1.25; word-break: break-word; }
        .issue-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }
        .issue-notes {
            font-size: 13.5px; color: var(--text-secondary); line-height: 1.5;
            padding: 10px 12px; border-radius: 10px; background: rgba(127, 127, 127, 0.08);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .issue-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .issue-tag {
            font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
            background: rgba(127, 127, 127, 0.1); color: var(--text-secondary); border: 1px solid var(--border-color);
        }
        .issue-tag.good { background: rgba(16, 185, 129, 0.12); color: #059669; border-color: transparent; }
        .issue-tag.last { background: rgba(168, 85, 247, 0.14); color: #7c3aed; border-color: transparent; }
        [data-theme="dark"] .issue-tag.good { color: #6ee7b7; }
        [data-theme="dark"] .issue-tag.last { color: #c4b5fd; }

        .issue-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
        .issue-actions .open-btn { flex: 1; padding: 11px 14px; }
        .issue-actions .btn-secondary { padding: 11px 14px; }
        .issue-actions .btn-remove { padding: 11px 13px; }

        /* "Add a medical issue" card */
        .add-card {
            border: 2px dashed var(--border-color);
            border-radius: 18px;
            background: transparent;
            min-height: 230px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            cursor: pointer; color: var(--text-secondary); font-weight: 700; font-size: 14.5px; font-family: inherit;
            transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.25s ease;
        }
        .add-card:hover { border-color: #a855f7; color: var(--text-primary); background: rgba(168, 85, 247, 0.06); transform: translateY(-4px); }
        .add-card .plus {
            width: 58px; height: 58px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 400; line-height: 1; color: var(--text-primary);
            border: 2px solid transparent;
            background:
                linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                linear-gradient(135deg, #ff007a, #a855f7, #3b82f6, #00f2fe) border-box;
            transition: transform 0.3s ease;
        }
        .add-card:hover .plus { transform: rotate(90deg); }

        /* "How it works" strip under the issues */
        .how-strip { margin-top: 8px; }
        .how-head { text-align: center; margin: 22px 0 18px; }
        .how-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 2.5px; color: var(--text-muted); text-transform: uppercase; }
        .how-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .how-step {
            position: relative; border: 1px solid var(--border-color); border-radius: 16px;
            background: var(--card-bg); padding: 20px 18px 18px;
        }
        .how-num { position: absolute; top: 16px; right: 18px; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--text-muted); }
        .how-icon {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 19px; color: var(--text-primary); background: rgba(127, 127, 127, 0.1); margin-bottom: 14px;
        }
        .how-step p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text-secondary); }
        .how-bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-top: 16px; align-items: stretch; }
        .how-label {
            border: 1px solid rgba(245, 158, 11, 0.35); border-left: 4px solid #f59e0b; border-radius: 14px;
            background: rgba(245, 158, 11, 0.08); padding: 16px 18px;
        }
        .how-label-title { font-weight: 700; font-size: 14.5px; color: var(--text-primary); margin-bottom: 4px; }
        .how-label-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .how-notice {
            margin: 0; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px 18px;
            font-size: 12.5px; line-height: 1.6; color: var(--text-muted); display: block;
        }
        @media (max-width: 900px) {
            .how-steps { grid-template-columns: repeat(2, 1fr); }
            .how-bottom { grid-template-columns: 1fr; }
        }
        @media (max-width: 520px) {
            .how-steps { grid-template-columns: 1fr; }
            .add-issue-btn { width: 100%; }
        }

        /* Add / edit modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 2000;
        }
        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 28px;
            animation: chatPop 0.2s ease-out;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .form-error { color: var(--alert-red); font-size: 12.5px; margin-top: 6px; }

        .welcome-name { color: var(--hospital-teal); }
    </style>
</head>
<body data-page="issues" data-title-key="pageTitle">

    <nav class="ehr-navbar">
        <div class="nav-container">
            <div class="hospital-brand">
                <div class="cross-icon">+</div>
                <div class="brand-text">
                    <span class="brand-title">NEUTRIX HEALTH</span>
                    <span class="brand-sub" data-i18n="brandSub">Post-Discharge Patient Portal</span>
                </div>
            </div>
            <div class="system-controls">
                <button class="ctrl-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
                <button class="ctrl-btn" id="langToggle" type="button">🌐 മലയാളം</button>
            </div>
        </div>
    </nav>

    <main class="ehr-workspace issues-page">

        <section class="ehr-card">
            <div class="issues-head">
                <div>
                    <div class="issues-title-row">
                        <h2 data-it="title">🗂 My Medical Issues</h2>
                        <span class="issues-count" id="issueCountBadge">0</span>
                    </div>
                    <p class="subtitle" id="welcomeLine"></p>
                    <p class="issues-hint" data-it="hint"></p>
                </div>
                <button id="addIssueBtn" class="btn-success add-issue-btn" type="button" data-it="addBtn">＋ Add Medical Issue</button>
            </div>

            <div id="issueGrid" class="issue-grid"></div>
        </section>

        <section class="how-strip">
            <div class="how-head">
                <span class="how-eyebrow" data-it="howTitle">HOW IT WORKS</span>
            </div>
            <div class="how-steps">
                <div class="how-step"><span class="how-num">01</span><span class="how-icon">＋</span><p data-it="step1"></p></div>
                <div class="how-step"><span class="how-num">02</span><span class="how-icon">📂</span><p data-it="step2"></p></div>
                <div class="how-step"><span class="how-num">03</span><span class="how-icon">🧠</span><p data-it="step3"></p></div>
                <div class="how-step"><span class="how-num">04</span><span class="how-icon">🗂</span><p data-it="step4"></p></div>
            </div>
            <div class="how-bottom">
                <div class="how-label">
                    <div class="how-label-title" data-i18n="labelTitle"></div>
                    <div class="how-label-text" data-i18n="labelText"></div>
                </div>
                <p class="how-notice" data-i18n-html="notice"></p>
            </div>
        </section>

    </main>

    <!-- Add / edit issue -->
    <div id="issueModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <form id="issueForm" class="modal-card" novalidate>
            <div class="card-header" style="margin-bottom: 18px;">
                <div>
                    <h2 id="modalTitle"></h2>
                    <p class="subtitle" data-it="modalSub"></p>
                </div>
            </div>

            <div class="form-group">
                <label for="fTitle"><span data-it="fTitle"></span> <span class="req">*</span></label>
                <input id="fTitle" class="modern-input" maxlength="80" data-itp="fTitlePh">
                <div id="fTitleError" class="form-error hidden" data-it="fTitleError"></div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="fCategory" data-it="fCategory"></label>
                    <select id="fCategory" class="modern-select"></select>
                </div>
                <div class="form-group">
                    <label for="fDate" data-it="fDate"></label>
                    <input id="fDate" type="date" class="modern-input">
                </div>
            </div>

            <div class="form-group">
                <label for="fHospital" data-it="fHospital"></label>
                <input id="fHospital" class="modern-input" maxlength="80" data-itp="fHospitalPh">
            </div>

            <div class="form-group">
                <label for="fNotes" data-it="fNotes"></label>
                <textarea id="fNotes" class="modern-textarea" rows="3" maxlength="300" data-itp="fNotesPh"></textarea>
            </div>

            <div class="modal-actions">
                <button id="cancelBtn" class="btn-secondary" type="button" data-it="cancel"></button>
                <button id="saveBtn" class="btn-success" type="submit"></button>
            </div>
        </form>
    </div>

    <script src="common.js?v=20261029d"></script>
    <script src="account-menu.js?v=20261029d"></script>
    <script src="feedback.js?v=20261029f"></script>
    <script src="issues.js"></script>
</body>
</html>
