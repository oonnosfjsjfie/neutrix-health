<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <meta name="format-detection" content="telephone=no">
    <title>Emergency Medical Info | Neutrix Health</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
    <!--
        Emergency medical card, opened by scanning the QR code on the patient's Doctor Card.
        The details are INSIDE the link (after "#", which browsers never send to any server), so nothing is
        stored online and anyone who scans it can read it, with no sign-in. Made on the patient's device.
        Built for a stranger's phone: big text, one-thumb call bar at the bottom, the most urgent facts first.
    -->
    <style>
        :root { --bg: #000; --card: #141414; --card2: #1b1b1b; --line: #2a2a2a; --text: #fff; --muted: #a3a3a3;
                --red: #ff4d5e; --red-bg: #1a0a0d; --red-line: #6b2530; --amber: #fbbf24; --amber-bg: #1c1405; --amber-line: #5c4310;
                --safe-b: env(safe-area-inset-bottom, 0px); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; color-scheme: dark; scrollbar-color: #353b45 #000; }
        * { scrollbar-color: #353b45 transparent; }
        html.in-preview, html.in-preview * { scrollbar-width: none; } html.in-preview ::-webkit-scrollbar { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #353b45; border-radius: 8px; }
        body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(120px + var(--safe-b)); }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .pill { color: var(--red); border: 1.5px solid var(--red-line); background: var(--red-bg); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 12.5px; letter-spacing: .06em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .pill::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 7px; vertical-align: 1px; animation: pulse 1.6s infinite; }
        @keyframes pulse { 50% { opacity: .25; } }
        @media (prefers-reduced-motion: reduce) { .pill::before { animation: none; } }
        .lang { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 12px; font: 600 13px Inter, system-ui, sans-serif; min-height: 36px; cursor: pointer; }

        /* who */
        .who > div:last-child { min-width: 0; }
        .who { display: flex; align-items: center; gap: 14px; margin: 20px 0 16px; }
        .av { width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--card2); border: 2px solid var(--red-line); font: 700 24px "Source Serif 4", Georgia, serif; }
        h1 { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(26px, 7.5vw, 36px); margin: 0; line-height: 1.1; word-break: break-word; }
        .meta { color: var(--muted); font-size: 15.5px; margin-top: 4px; }

        /* quick facts */
        .facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 10px; }
        .fact { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; min-width: 0; }
        .fact .k { color: var(--muted); font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
        .fact .v { font-size: 20px; font-weight: 700; margin-top: 4px; word-break: break-word; }
        .fact.blood { background: var(--red-bg); border-color: var(--red-line); }
        .fact.blood .v { font: 700 40px/1 "Source Serif 4", Georgia, serif; color: var(--red); margin-top: 6px; }
        .fact.wide { grid-column: 1 / -1; }

        /* allergy + alerts */
        .alert { display: flex; gap: 12px; align-items: flex-start; border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; border: 1.5px solid var(--red-line); background: var(--red-bg); }
        .alert > div { min-width: 0; }
        .alert .ic { font-size: 22px; line-height: 1.2; flex: none; }
        .alert .k { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--red); }
        .alert .v { font-size: 19px; font-weight: 700; line-height: 1.4; margin-top: 2px; word-break: break-word; }
        .alert .s { font-size: 14.5px; color: #d4d4d4; line-height: 1.45; margin-top: 3px; }
        .alert.warn { border-color: var(--amber-line); background: var(--amber-bg); }
        .alert.warn .k { color: var(--amber); }
        .alert.calm { border-color: var(--line); background: var(--card); }
        .alert.calm .k { color: var(--muted); }

        /* sections */
        .sec { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; }
        .sec h2 { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
        .sec .txt { font-size: 17.5px; line-height: 1.5; word-break: break-word; white-space: pre-line; }
        .meds { list-style: none; margin: 0; padding: 0; }
        .meds li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16.5px; }
        .meds li:first-child { border-top: 0; padding-top: 2px; }
        .meds b { font-weight: 650; word-break: break-word; }
        .meds span { color: var(--muted); text-align: right; font-size: 14.5px; flex: none; max-width: 48%; }
        .carer-name { font-size: 19px; font-weight: 700; }
        .carer-ph { color: var(--muted); font-size: 15px; margin-top: 2px; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 16px; color: #fff; background: var(--card2); border: 1px solid var(--line); }
        .btn.green { background: #14532d; border-color: #166534; }
        .btn.full { grid-column: 1 / -1; }

        /* helper steps */
        .help { border: 1px dashed #3a3a3a; border-radius: 18px; padding: 12px 16px; margin: 0 0 10px; }
        .help h2 { margin: 0 0 6px; font-size: 15px; }
        .help ol { margin: 0; padding-left: 20px; color: #d4d4d4; font-size: 15px; line-height: 1.6; }

        .foot { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 16px; }
        .stale { color: var(--amber); font-weight: 600; }
        .empty { text-align: center; padding: 60px 10px; color: var(--muted); font-size: 17px; }

        /* one-thumb call bar */
        .callbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 12px calc(10px + var(--safe-b));
                   background: rgba(0, 0, 0, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid #1f1f1f; }
        .callbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
        .callbar.three .in { grid-template-columns: 1.3fr 1fr 1fr; }
        .callbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60px; border-radius: 16px; text-decoration: none; color: #fff; font-weight: 800; font-size: 18px; line-height: 1.1; background: #dc2626; }
        .callbar a small { font-size: 11.5px; font-weight: 600; opacity: .85; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .callbar a.alt { background: transparent; border: 2px solid #dc2626; color: #ff8a95; }
        .callbar a.cg { background: #1b1b1b; border: 1px solid #333; }
        a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

        @media (min-width: 700px) { main { padding-top: 28px; } }
        @media (max-width: 360px) { main { padding-left: 12px; padding-right: 12px; } .pill { font-size: 11px; padding: 5px 10px; } .fact { padding: 10px 12px; } .fact.blood .v { font-size: 34px; }
            .fact .k, .alert .k, .sec h2 { font-size: 11.5px; } .callbar a { font-size: 16px; } }
        @media print { body { background: #fff; color: #000; } .sec, .fact, .alert { background: #fff !important; border-color: #999 !important; } .sec .txt, h1, .alert .v, .fact .v { color: #000 !important; }
                       .callbar, .lang, .help, .btns { display: none !important; } main { padding-bottom: 20px; } }

        /* computers: "call from your phone" box */
        .callbox { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
        .callbox > div { background: var(--card); border: 1px solid var(--red-line); border-radius: 18px; padding: 20px; max-width: 400px; width: 100%; text-align: center; }
        .callbox .num { font: 900 56px/1.1 ui-monospace, Menlo, Consolas, monospace; color: var(--red); letter-spacing: .04em; margin: 8px 0 2px; word-break: break-all; }
        .callbox p { color: var(--muted); line-height: 1.5; }
        .callbox button, .callbox a { display: inline-block; margin: 4px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: #fff; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
<script>
    // Shown as a preview inside the app (Emergency Card page): no scrollbars, like on a real phone
    if (window.self !== window.top) document.documentElement.classList.add('in-preview');
</script>
<main>
    <div class="top"><span class="pill" id="pill">EMERGENCY MEDICAL INFO</span><button type="button" class="lang" id="lang">മലയാളം</button></div>
    <div id="card"></div>
</main>
<nav class="callbar" id="callbar" aria-label="Emergency calls"><div class="in" id="callin"></div></nav>
<script>
(async function () {
    const box = document.getElementById('card');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const W = {
        en: { pill: 'EMERGENCY MEDICAL INFO', other: 'മലയാളം', blood: 'Blood group', age: 'Age', sex: 'Sex', born: 'Born', yrs: 'yrs', unknown: 'Not recorded',
              allergy: 'Allergic to', noAllergy: 'Allergies', noneRec: 'None recorded. Ask the patient or family if possible.',
              bleed: 'Takes blood thinners', bleedS: 'Bleeding may be harder to stop. Tell the doctor before any injection, procedure or surgery.',
              sugar: 'Takes medicine that can cause low sugar', sugarS: 'If they are confused, sweaty, shaky or drowsy, check blood sugar.',
              device: 'Has an implant', deviceS: 'Tell the hospital before an MRI scan or surgery.',
              cond: 'Medical conditions', meds: 'Daily medicines', notes: 'Other notes', carer: 'Caregiver / family',
              call: 'Call', wa: 'WhatsApp', email: 'Email',
              helpT: 'Helping this person?', help: ['Call 108 for an ambulance (free, works without balance).', 'Call their caregiver using the button below.', 'Show this screen to the paramedics or doctor.'],
              c108: 'Ambulance', c112: 'Emergency',
              foot: 'Shared by the patient from the Neutrix Health app', upd: 'updated', stale: 'This card is over 2 months old, so medicines may have changed.',
              disc: "These are the patient's own records, not a doctor's note. Check medicines and allergies with the patient's doctor or hospital records when possible.",
              empty: 'No medical details in this link.<br>Scan the QR code on the patient\'s Neutrix Doctor Card.' },
        ml: { pill: 'അടിയന്തര മെഡിക്കൽ വിവരം', other: 'English', blood: 'രക്തഗ്രൂപ്പ്', age: 'പ്രായം', sex: 'ലിംഗം', born: 'ജനനം', yrs: 'വയസ്സ്', unknown: 'രേഖപ്പെടുത്തിയിട്ടില്ല',
              allergy: 'അലർജി ഉള്ളത്', noAllergy: 'അലർജി', noneRec: 'ഒന്നും രേഖപ്പെടുത്തിയിട്ടില്ല. സാധിക്കുമെങ്കിൽ രോഗിയോടോ കുടുംബത്തോടോ ചോദിക്കുക.',
              bleed: 'രക്തം നേർപ്പിക്കുന്ന മരുന്ന് കഴിക്കുന്നു', bleedS: 'രക്തസ്രാവം നിർത്താൻ പ്രയാസമായേക്കാം. ഇൻജക്ഷൻ, പ്രൊസീജർ, സർജറി എന്നിവയ്ക്ക് മുൻപ് ഡോക്ടറോട് പറയുക.',
              sugar: 'ഷുഗർ കുറയ്ക്കാവുന്ന മരുന്ന് കഴിക്കുന്നു', sugarS: 'ആശയക്കുഴപ്പം, വിയർപ്പ്, വിറയൽ, മയക്കം ഉണ്ടെങ്കിൽ ഷുഗർ പരിശോധിക്കുക.',
              device: 'ശരീരത്തിൽ ഉപകരണം ഉണ്ട്', deviceS: 'MRI സ്കാനിനോ സർജറിക്കോ മുൻപ് ആശുപത്രിയെ അറിയിക്കുക.',
              cond: 'രോഗാവസ്ഥകൾ', meds: 'ദിവസേനയുള്ള മരുന്നുകൾ', notes: 'മറ്റ് വിവരങ്ങൾ', carer: 'പരിചാരകൻ / കുടുംബം',
              call: 'വിളിക്കുക', wa: 'WhatsApp', email: 'ഇമെയിൽ',
              helpT: 'ഈ വ്യക്തിയെ സഹായിക്കുകയാണോ?', help: ['ആംബുലൻസിന് 108 വിളിക്കുക (സൗജന്യം, ബാലൻസ് ഇല്ലാതെയും പ്രവർത്തിക്കും).', 'താഴെയുള്ള ബട്ടൺ ഉപയോഗിച്ച് പരിചാരകനെ വിളിക്കുക.', 'ഈ സ്ക്രീൻ പാരാമെഡിക്കുകൾക്കോ ഡോക്ടർക്കോ കാണിക്കുക.'],
              c108: 'ആംബുലൻസ്', c112: 'അടിയന്തരം',
              foot: 'Neutrix Health ആപ്പിൽ നിന്ന് രോഗി പങ്കിട്ടത്', upd: 'പുതുക്കിയത്', stale: 'ഈ കാർഡിന് 2 മാസത്തിലേറെ പഴക്കമുണ്ട്, മരുന്നുകൾ മാറിയിരിക്കാം.',
              disc: 'ഇവ രോഗിയുടെ സ്വന്തം രേഖകളാണ്, ഡോക്ടറുടെ കുറിപ്പല്ല. സാധിക്കുമ്പോൾ ഡോക്ടറുമായോ ആശുപത്രി രേഖകളുമായോ ഒത്തുനോക്കുക.',
              empty: 'ഈ ലിങ്കിൽ മെഡിക്കൽ വിവരങ്ങളില്ല.<br>രോഗിയുടെ Neutrix ഡോക്ടർ കാർഡിലെ QR കോഡ് സ്കാൻ ചെയ്യുക.' }
    };
    let lang = 'en';
    try { if (localStorage.getItem('nxEmLang') === 'ml') lang = 'ml'; } catch (e) {}

    function b64urlToBytes(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        return Uint8Array.from(bin, c => c.charCodeAt(0));
    }
    async function decode(hash) {
        const m = /^#?(z|j)\.(.+)$/.exec(hash || '');
        if (!m) return null;
        let bytes = b64urlToBytes(m[2]);
        if (m[1] === 'z') {
            const ds = new DecompressionStream('deflate-raw');
            bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
        }
        return JSON.parse(new TextDecoder().decode(bytes));
    }
    let d = null;
    try { d = await decode(location.hash); } catch (e) { console.warn(e); }

    const tel = p => String(p || '').replace(/[^\d+]/g, '');
    // WhatsApp needs the country code; a plain 10-digit Indian mobile gets +91
    const wa = p => { let n = tel(p).replace(/^\+/, ''); if (/^0?[6-9]\d{9}$/.test(n)) n = '91' + n.slice(-10); return n.length >= 10 ? 'https://wa.me/' + n : ''; };
    const fmtDate = iso => { try { return new Date(iso + (iso.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return iso; } };

    function render() {
        const t = W[lang];
        document.documentElement.lang = lang === 'ml' ? 'ml' : 'en';
        document.getElementById('pill').textContent = t.pill;
        document.getElementById('lang').textContent = t.other;
        const cg = d && d.cg && d.cg.p ? d.cg : null;
        const bar = document.getElementById('callbar');
        bar.classList.toggle('three', !!cg);
        document.getElementById('callin').innerHTML =
            `<a href="tel:108">📞 108<small>${esc(t.c108)}</small></a><a class="alt" href="tel:112">🆘 112<small>${esc(t.c112)}</small></a>` +
            (cg ? `<a class="cg" href="tel:${esc(tel(cg.p))}">👤 ${esc(t.call)}<small>${esc(cg.n || cg.p)}</small></a>` : '');
        if (!d) { box.innerHTML = `<p class="empty">${t.empty}</p>`; return; }

        const sexWord = { Male: lang === 'ml' ? 'പുരുഷൻ' : 'Male', Female: lang === 'ml' ? 'സ്ത്രീ' : 'Female' }[d.g] || d.g || '';
        const born = d.b ? `${t.born} ${fmtDate(d.b)}` : '';
        const initial = String(d.n || '?').trim().charAt(0).toUpperCase();
        const alertBox = (cls, ic, k, v, s) => `<div class="alert ${cls}"><span class="ic" aria-hidden="true">${ic}</span><div><div class="k">${esc(k)}</div>${v ? `<div class="v">${v}</div>` : ''}${s ? `<div class="s">${esc(s)}</div>` : ''}</div></div>`;
        const al = String(d.al || '').trim();
        const noAl = !al || /^(none|nil|no|not provided|nkda|no known)/i.test(al);
        const W2 = { bleed: ['🩸', t.bleed, t.bleedS], sugar: ['🍬', t.sugar, t.sugarS], device: ['🫀', t.device, t.deviceS] };
        const alerts = (d.w || []).filter(x => W2[x[0]]).map(([k, v]) => alertBox('warn', W2[k][0], W2[k][1], esc(v), W2[k][2])).join('');
        const meds = (d.m || []).map(x => `<li><b>${esc(x[0])}</b>${x[1] ? `<span>${esc(x[1])}</span>` : ''}</li>`).join('');
        const sec = (h, body) => body ? `<section class="sec"><h2>${esc(h)}</h2>${body}</section>` : '';
        let carer = '';
        if (d.cg) {
            const w = d.cg.p ? wa(d.cg.p) : '';
            carer = `<div class="carer-name">${esc(d.cg.n || '')}</div>${d.cg.p ? `<div class="carer-ph">${esc(d.cg.p)}</div>` : ''}
                <div class="btns">${d.cg.p ? `<a class="btn${w ? '' : ' full'}" href="tel:${esc(tel(d.cg.p))}">📞 ${esc(t.call)}</a>` : ''}${w ? `<a class="btn green" href="${esc(w)}" target="_blank" rel="noopener">💬 ${esc(t.wa)}</a>` : ''}${d.cg.e ? `<a class="btn full" href="mailto:${esc(d.cg.e)}">✉️ ${esc(t.email)}</a>` : ''}</div>`;
        }
        const old = d.u && (Date.now() - new Date(d.u).getTime()) > 62 * 86400000;
        document.title = `${d.n || 'Patient'} | Emergency Medical Info`;
        box.innerHTML = `
            <div class="who"><div class="av" aria-hidden="true">${esc(initial)}</div><div><h1>${esc(d.n || 'Patient')}</h1>${born ? `<div class="meta">${esc(born)}</div>` : ''}</div></div>
            <div class="facts">
                <div class="fact blood"><div class="k">${esc(t.blood)}</div><div class="v">${esc(d.bg || '—')}</div></div>
                <div class="fact"><div class="k">${esc(t.age)}</div><div class="v">${d.a ? esc(d.a) + ' ' + esc(t.yrs) : esc(t.unknown)}</div>
                    ${sexWord ? `<div class="k" style="margin-top:10px">${esc(t.sex)}</div><div class="v">${esc(sexWord)}</div>` : ''}</div>
            </div>
            ${noAl ? alertBox('calm', '🛈', t.noAllergy, '', t.noneRec) : alertBox('', '⚠️', t.allergy, esc(al), '')}
            ${alerts}
            <div class="help"><h2>${esc(t.helpT)}</h2><ol>${t.help.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>
            ${sec(t.cond, d.c ? `<div class="txt">${esc(d.c)}</div>` : '')}
            ${sec(t.meds, meds ? `<ul class="meds">${meds}</ul>` : '')}
            ${sec(t.notes, d.x ? `<div class="txt">${esc(d.x)}</div>` : '')}
            ${sec(t.carer, carer)}
            <p class="foot">${esc(t.foot)}${d.u ? ' · ' + esc(t.upd) + ' ' + esc(fmtDate(d.u)) : ''}.${old ? ` <span class="stale">${esc(t.stale)}</span>` : ''}<br>${esc(t.disc)}</p>`;
    }
    render();
    document.getElementById('lang').addEventListener('click', () => {
        lang = lang === 'en' ? 'ml' : 'en';
        try { localStorage.setItem('nxEmLang', lang); } catch (e) {}
        render();
    });
})();
</script>
<script>
// A computer can't make calls; "tel:" links get passed to whatever Windows/macOS app is set (sometimes a Google app).
// On computers show the number big instead. Phones open the dialer as normal.
(function () {
    const isPhone = () => /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900);
    document.addEventListener('click', e => {
        const a = e.target.closest && e.target.closest('a[href^="tel:"]');
        if (!a || isPhone() || a.dataset.force) return;
        e.preventDefault();
        const num = decodeURIComponent(a.getAttribute('href').slice(4));
        const what = num === '108' ? 'Ambulance' : num === '112' ? 'All emergencies' : '';
        const box = document.createElement('div');
        box.className = 'callbox';
        box.innerHTML = '<div role="dialog" aria-modal="true"><b>📞 Call from your phone</b><div class="num"></div>' + (what ? '<div><b>' + what + '</b></div>' : '') +
            '<p>A computer can’t make phone calls. Dial this number on any phone now.' + (what ? ' It’s free and works even without balance.' : '') + '</p>' +
            '<button type="button" class="cp">Copy number</button><a class="try" data-force="1">Try from this computer</a> <button type="button" class="cl">Close</button></div>';
        box.querySelector('.num').textContent = num;
        box.querySelector('.try').href = 'tel:' + num;
        box.querySelector('.cp').onclick = async ev => { try { await navigator.clipboard.writeText(num); ev.target.textContent = 'Copied'; } catch (err) {} };
        box.addEventListener('click', ev => { if (ev.target === box || ev.target.classList.contains('cl')) box.remove(); });
        document.body.appendChild(box);
    }, true);
})();
</script>
</body>
