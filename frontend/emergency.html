<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <title>Emergency Medical Info | Neutrix Health</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
    <!--
        Emergency medical card, opened by scanning the QR code on the patient's Doctor Card.
        The details are INSIDE the link (after "#", which browsers never send to any server), so nothing is
        stored online and anyone who scans it can read it, with no sign-in. Made on the patient's device.
    -->
    <style>
        :root { --bg: #000; --card: #141414; --line: #2a2a2a; --text: #fff; --muted: #a3a3a3; --red: #ff4d5e; --red-bg: #170a0c; --red-line: #6b2530; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 640px; margin: 0 auto; padding: 22px 16px 40px; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .pill { color: var(--red); border: 1.5px solid var(--red-line); background: var(--red-bg); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; letter-spacing: .06em; }
        .brand { color: var(--muted); font-weight: 600; font-size: 14px; }
        h1 { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(32px, 8vw, 44px); margin: 22px 0 4px; line-height: 1.1; word-break: break-word; }
        .meta { color: var(--muted); font-size: 18px; margin-bottom: 22px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; margin-bottom: 14px; }
        .card .lbl { color: var(--muted); font-weight: 600; font-size: 15px; margin-bottom: 6px; }
        .card .val { font-size: 19px; line-height: 1.55; white-space: pre-line; word-break: break-word; }
        .card.red { border-color: var(--red-line); }
        .card.red .lbl { color: var(--red); }
        .blood { display: flex; justify-content: space-between; align-items: center; background: var(--red-bg); border-color: var(--red-line); padding: 22px 24px; }
        .blood .lbl { margin: 0; font-weight: 500; font-size: 17px; }
        .blood .big { font-family: "Source Serif 4", Georgia, serif; font-size: 52px; color: var(--red); line-height: 1; }
        .val a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
        .calls { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }
        .calls a { flex: 1 1 160px; text-align: center; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px; border-radius: 14px; background: #dc2626; color: #fff; }
        .calls a.alt { background: transparent; border: 2px solid #dc2626; color: #ff8a95; }
        .foot { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 18px; }
        .empty { text-align: center; padding: 60px 10px; color: var(--muted); font-size: 17px; }
        .hidden { display: none; }
        @media print { body { background: #fff; color: #000; } .card { background: #fff; border-color: #999; } .card .val, h1 { color: #000; } .calls { display: none; } }
    </style>
</head>
<body>
<main>
    <div class="top"><span class="pill">EMERGENCY MEDICAL INFO</span><span class="brand">Neutrix Health</span></div>
    <div id="card"></div>
</main>
<script>
(async function () {
    const box = document.getElementById('card');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function b64urlToBytes(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        return Uint8Array.from(bin, c => c.charCodeAt(0));
    }
    async function decode(hash) {
        const m = /^#?(z|j)\.(.+)$/.exec(hash || '');
        if (!m) return null;
        let bytes = b64urlToBytes(m[2]);
        if (m[1] === 'z') {
            const ds = new DecompressionStream('deflate-raw');
            bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
        }
        return JSON.parse(new TextDecoder().decode(bytes));
    }
    let d = null;
    try { d = await decode(location.hash); } catch (e) { console.warn(e); }
    if (!d) {
        box.innerHTML = '<p class="empty">No medical details in this link.<br>Scan the QR code on the patient\'s Neutrix Doctor Card.</p>';
        return;
    }
    const age = d.a ? `${d.a} yrs` : '';
    let born = '';
    if (d.b) { try { born = 'Born ' + new Date(d.b + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) {} }
    const meta = [[d.g, age].filter(Boolean).join(', '), born].filter(Boolean).join(' · ');
    const tel = p => String(p || '').replace(/[^\d+]/g, '');
    const card = (lbl, val, cls) => val ? `<div class="card ${cls || ''}"><div class="lbl">${esc(lbl)}</div><div class="val">${val}</div></div>` : '';
    const meds = (d.m || []).map(x => esc(x[0]) + (x[1] ? ' - ' + esc(x[1]) : '')).join('\n');
    const carer = d.cg ? [esc(d.cg.n), d.cg.p ? `<a href="tel:${esc(tel(d.cg.p))}">${esc(d.cg.p)}</a>` : '', d.cg.e ? `<a href="mailto:${esc(d.cg.e)}">${esc(d.cg.e)}</a>` : ''].filter(Boolean).join('\n') : '';
    document.title = `${d.n || 'Patient'} | Emergency Medical Info`;
    box.innerHTML = `
        <h1>${esc(d.n || 'Patient')}</h1>
        ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
        ${d.bg ? `<div class="card blood"><div class="lbl">Blood group</div><div class="big">${esc(d.bg)}</div></div>` : ''}
        ${card('Known allergies', esc(d.al || 'None recorded'), 'red')}
        ${card('Main medical condition', esc(d.c || ''))}
        ${card('Daily medicines', meds)}
        ${card('Other important notes', esc(d.x || ''))}
        ${card('Caregiver', carer)}
        <div class="calls"><a href="tel:108">📞 Call 108 (ambulance)</a><a class="alt" href="tel:112">🆘 Call 112</a></div>
        <p class="foot">Shared by the patient from the Neutrix Health app${d.u ? ' · updated ' + esc(new Date(d.u).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })) : ''}.
        These are the patient's own records, not a doctor's note. Check medicines and allergies with the patient's doctor or hospital records when possible.</p>`;
})();
</script>
</body>
</html>
