<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <script src="pwa.js?v=20261125a" defer></script>
    <script src="native-app.js?v=20261125c"></script>
    <script src="app-shell.js?v=20261127c"></script>
    <script src="assistant.js?v=20261127c" defer></script>
    <link rel="apple-touch-icon" href="assets/neutrix-icon.png">
    <!-- Accounts + online saving (must load before issue-scope.js) -->
    <script src="firebase-config.js?v=20261030c"></script>
    <script src="neutrix-cloud.js?v=20261127c"></script>
    <!-- Login check, per-issue data and the issue bar -->
    <script src="issue-scope.js?v=20261127c"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutrix | 3D View</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="skin.css?v=20261127c">
    <link rel="stylesheet" href="body3d.css?v=20261126i">
</head>
<body data-page="body3d">

    <nav class="ehr-navbar">
        <div class="nav-container">
            <div class="hospital-brand">
                <div class="cross-icon">+</div>
                <div class="brand-text">
                    <span class="brand-title">NEUTRIX HEALTH</span>
                    <span class="brand-sub" data-i18n="brandSub">Post-Discharge Patient Portal</span>
                </div>
            </div>
            <div class="system-controls">
                <a class="ctrl-btn nav-link hidden" data-nav="upload" href="summary.html" data-i18n="navUpload">🏠 Upload</a>
                <a class="ctrl-btn nav-link hidden" data-nav="report" href="report.html" data-i18n="navReport">📋 Summary</a>
                <a class="ctrl-btn nav-link hidden" data-nav="schedule" href="schedule.html" data-i18n="navSchedule">💊 My Schedule</a>
                <button class="ctrl-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
                <button class="ctrl-btn" id="langToggle" type="button">🌐 മലയാളം</button>
            </div>
        </div>
    </nav>

    <main class="ehr-workspace nxb-page">
        <!-- The 3D body: drag to turn, pinch / scroll to zoom, tap a red area -->
        <section id="bodyView" aria-label="3D body"></section>
        <!-- What each red area means -->
        <aside id="bodySide" class="nxb-side" aria-label="Problem areas"></aside>
    </main>

    <script src="common.js?v=20261127c"></script>
    <script src="account-menu.js?v=20261030e"></script>
    <script src="feedback.js?v=20261030c"></script>
    <script src="chat.js?v=20261030c"></script>
    <script src="body3d.js?v=20261126i"></script>
    <script>
        if (window.NxBody) NxBody.mountFull({ view: 'bodyView', side: 'bodySide' });
        document.addEventListener('neutrix:langchange', () => location.reload());
    </script>
</body>
</html>
