<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Neutrix | Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0b0b; color: #f5f5f5;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 22px; margin: 18px 0 8px; }
        p { color: #a3a3a3; font-size: 15px; line-height: 1.5; max-width: 320px; margin: 0 auto 20px; }
        button { padding: 12px 26px; border-radius: 30px; border: none; background: #fff; color: #000; font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>
    <div>
        <img src="assets/app/icon-192.png" alt="Neutrix Health">
        <h1>You're offline</h1>
        <p>Neutrix needs the internet to load your recovery plan. Check your connection and try again.<br>ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
