<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <script src="pwa.js?v=20261030a" defer></script>
    <link rel="apple-touch-icon" href="assets/neutrix-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutrix | Sign In</title>
    <script>
        // Use the same light/dark setting as the website and dashboard
        try {
            if (localStorage.getItem('neutrixTheme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
    </script>
    <script src="firebase-config.js?v=20261030c"></script>
    <script src="neutrix-cloud.js?v=20261030c"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="skin.css?v=20261030g">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .signin-top { padding: 16px 32px; border-bottom: 1px solid var(--border-color); }
        .signin-top a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600; }
        .signin-top a:hover { color: var(--text-primary); }
        .signin-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
        .signin-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 36px 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            animation: nxReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes nxReveal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        .signin-logo { display: flex; justify-content: center; margin-bottom: 20px; }
        .signin-logo img { height: 56px; width: auto; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
        .eyebrow { display: block; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--text-muted); }
        .signin-card h1 {
            font-family: "Georgia", "Times New Roman", serif;
            font-weight: 400;
            font-size: 32px;
            letter-spacing: -0.5px;
            text-align: center;
            margin: 6px 0 4px;
        }
        .signin-card .sub { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 22px; }

        /* Sign In / Sign Up switch */
        .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 30px; background: var(--pill-bg, rgba(0,0,0,0.05)); margin-bottom: 22px; }
        .auth-tab {
            border: none; background: transparent; color: var(--text-secondary);
            padding: 10px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }
        .auth-tab.active { background: var(--text-primary); color: var(--on-primary); }

        .google-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px; border-radius: 30px; border: 1px solid var(--border-color);
            background: var(--card-bg); color: var(--text-primary); font-size: 14.5px; font-weight: 600; cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .google-btn:hover { border-color: var(--text-primary); transform: translateY(-1px); }
        .google-btn svg { width: 18px; height: 18px; }
        .or-line { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
        .or-line::before, .or-line::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 8px; }
        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
        }
        .field input:focus { outline: none; border-color: var(--text-primary); box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06); }
        .forgot { display: block; text-align: right; margin: -8px 0 14px; font-size: 12.5px; color: var(--text-secondary); background: none; border: none; cursor: pointer; padding: 0; margin-left: auto; }
        .forgot:hover { color: var(--text-primary); text-decoration: underline; }
        .signin-btn {
            width: 100%;
            padding: 14px;
            margin-top: 4px;
            border: none;
            border-radius: 30px;
            background: var(--text-primary);
            color: var(--on-primary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .signin-btn:hover { transform: translateY(-2px); }
        .signin-btn:disabled, .google-btn:disabled { opacity: 0.55; transform: none; cursor: wait; }
        .alert-success, .alert-danger, .alert-info { padding: 12px; margin-top: 16px; text-align: center; border-radius: 12px; font-size: 13.5px; font-weight: 600; }
        .alert-danger { background: rgba(220, 38, 38, 0.08); color: #b91c1c; border: 1px solid rgba(220, 38, 38, 0.3); }
        [data-theme="dark"] .alert-danger { color: #fca5a5; }
        .alert-info { background: rgba(59, 130, 246, 0.08); color: #1d4ed8; border: 1px solid rgba(59, 130, 246, 0.3); }
        [data-theme="dark"] .alert-info { color: #93c5fd; }
        .signin-foot { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="signin-top"><a href="home.html">← Back to Neutrix Health</a></div>

    <main class="signin-wrap">
        <div class="signin-card">
            <div class="signin-logo"><img src="assets/neutrix-logo.png" alt="Neutrix Health"></div>

            <span class="eyebrow">PATIENT PORTAL</span>
            <h1 id="authTitle">Welcome back</h1>
            <p class="sub" id="authSub">Sign in to see your recovery dashboard on any device.</p>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" id="tabSignIn" role="tab">Sign In</button>
                <button type="button" class="auth-tab" id="tabSignUp" role="tab">Sign Up</button>
            </div>

            <button type="button" class="google-btn" id="googleBtn">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.2 44 33 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                </svg>
                <span id="googleText">Continue with Google</span>
            </button>

            <div class="or-line" id="orText">OR</div>

            <!-- Sign In -->
            <form id="signInForm">
                <div class="field">
                    <label for="siEmail">EMAIL ADDRESS</label>
                    <input type="email" id="siEmail" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="siPassword">PASSWORD</label>
                    <input type="password" id="siPassword" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
                <button type="submit" class="signin-btn" id="signInBtn">Sign In →</button>
            </form>

            <!-- Sign Up -->
            <form id="signUpForm" class="hidden">
                <div class="field">
                    <label for="suName">FULL NAME</label>
                    <input type="text" id="suName" placeholder="e.g. Rahul Menon" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="suEmail">EMAIL ADDRESS</label>
                    <input type="email" id="suEmail" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="suPassword">PASSWORD (AT LEAST 6 CHARACTERS)</label>
                    <input type="password" id="suPassword" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="field">
                    <label for="suConfirm">CONFIRM PASSWORD</label>
                    <input type="password" id="suConfirm" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
                </div>
                <button type="submit" class="signin-btn" id="signUpBtn">Create My Account →</button>
            </form>

            <div id="loginFeedback"></div>
            <p class="signin-foot">Your reports and plans are saved to your account, so you can open them on any device.<br>Neutrix organizes and explains medical information. It does not replace your doctor.</p>
        </div>
    </main>

    <script src="signin.js"></script>
    <script src="feedback.js?v=20261030c"></script>
</body>
</html>
