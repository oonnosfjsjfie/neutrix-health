# Builds the Neutrix Android app (APK) and publishes it as a download on GitHub.
# The app (Capacitor, folder app/) shows the live Neutrix website in its own app window and keeps a copy
# on the phone for offline use, so website changes reach the app without a new build.
# Runs when anything in app/ changes, or by hand: Actions -> Build Android app -> Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor
        run: |
          npm install --no-audit --no-fund
          # Opens downloaded PDFs and calendar files in the right app (optional: the app falls back to Share)
          npm install --no-audit --no-fund @capacitor-community/file-opener@^6 || echo "::warning::file-opener not installed"

      - name: Google sign-in (only if the google-services.json secret is set)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64$GOOGLE_SERVICES_JSON" ]; then
            npm install --no-audit --no-fund @capacitor-firebase/authentication@^6 firebase@^10
            echo "HAS_GOOGLE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret: Google sign-in is off in the app (email sign-in works)."
          fi

      - name: Get the signing key from GitHub secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEUTRIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neutrix-release.jks"
            echo "NEUTRIX_KEYSTORE_FILE=$RUNNER_TEMP/neutrix-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No NEUTRIX_KEYSTORE_BASE64 secret: building with a temporary key."
          fi

      - name: Make the Android project
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          # google-services.json from Firebase: pasted as plain text (GOOGLE_SERVICES_JSON) or base64
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_B64" ]; then echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json; fi
          if [ -f android/app/google-services.json ]; then
            node -e "const j=require('./android/app/google-services.json');const c=j.client.find(c=>c.client_info.android_client_info.package_name==='com.neutrinos.neutrixhealth');if(!c)throw new Error('google-services.json has no com.neutrinos.neutrixhealth app');console.log('google-services.json OK, oauth clients:',(c.oauth_client||[]).map(o=>o.client_type).join(','))"
          fi
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          node scripts/patch-android.js
          npx cap sync android

      - name: Build the APK
        env:
          NEUTRIX_KEYSTORE_PASSWORD: ${{ secrets.NEUTRIX_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/NeutrixHealth.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: NeutrixHealth-apk
          path: app/out/NeutrixHealth.apk

      - name: Publish the APK as a download (Releases -> android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # versionCode/versionName lines are read by the app (native-app.js) to show "Update available"
          VC=$((100 + GITHUB_RUN_NUMBER)); VN="2.${GITHUB_RUN_NUMBER}"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/NeutrixHealth.apk \
            --title "Neutrix Health Android app (latest)" \
            --notes "Install on Android: delete the old Neutrix app first, then download NeutrixHealth.apk, open it, and allow 'Install unknown apps' if asked. Works offline after the first launch, and syncs with the website both ways. Built from ${GITHUB_SHA::7}.

          versionCode: ${VC}
          versionName: ${VN}" \
            --latest
