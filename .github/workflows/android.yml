# Builds the Neutrix Android app (APK) and publishes it as a download on GitHub.
# The app opens the live website, so website changes reach the app without a new build.
# Runs when anything in android/ changes, or by hand: Actions -> Build Android app -> Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Get the signing key from GitHub secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEUTRIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/neutrix-release.jks"
            echo "NEUTRIX_KEYSTORE_FILE=$RUNNER_TEMP/neutrix-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No NEUTRIX_KEYSTORE_BASE64 secret: building with a temporary key (the app will show an address bar)."
          fi

      - name: Build the APK
        env:
          NEUTRIX_KEYSTORE_PASSWORD: ${{ secrets.NEUTRIX_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/NeutrixHealth.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NeutrixHealth-apk
          path: out/NeutrixHealth.apk

      - name: Publish the APK as a download (Releases -> android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/NeutrixHealth.apk \
            --title "Neutrix Health Android app (latest)" \
            --notes "Install on Android: download NeutrixHealth.apk, open it, and allow 'Install unknown apps' if asked. The app opens the live Neutrix website, so it is always up to date. Built from ${GITHUB_SHA::7}." \
            --latest
